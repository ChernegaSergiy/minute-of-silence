<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Хвилина мовчання — mobile prototype</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body, #root { width: 100%; min-height: 100%; margin: 0; }
  html, body { min-height: 100dvh; }
  body { background: #e6e6e6; font-family: "Segoe UI Variable", "Segoe UI", system-ui, Roboto, sans-serif; display: flex; align-items: center; justify-content: center; }
  #root { min-height: 100dvh; display: flex; align-items: center; justify-content: center; }
  .phone { width: 100%; height: 100dvh; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .phone > main { min-height: 0; }
  .phone > main > * { flex: 0 0 auto; }
  .nav-content { display: flex !important; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; height: 100%; }
  .nav-icon { display: grid; place-items: center; height: 20px; }
  .nav-icon svg { width: 20px; height: 20px; }
  .nav-label { font-size: 9px !important; font-weight: 400 !important; line-height: 12px !important; letter-spacing: 0; white-space: nowrap; }
  .spin-icon { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (min-width: 500px) { .phone { width: 390px; height: min(780px, 96dvh); border-radius: 36px; border: 10px solid #111; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./main.jsx"></script>
</body>
</html>
