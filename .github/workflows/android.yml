name: Android APK Pipeline

on:
  push:
    branches: ["feature/**"]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Tauri Android
        run: npm run tauri -- android init --ci --skip-targets-install

      - name: Apply Android app template
        run: cp -R src-tauri/android-template/app/. src-tauri/gen/android/app/

      - name: Declare ceremony permissions and components in the manifest
        run: git apply src-tauri/android-template/ceremony-manifest.patch

      - name: Prepare Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.TAURI_ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/minute-of-silence-release.keystore"

      - name: Configure Android release signing
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.TAURI_ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TAURI_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          {
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "password=$ANDROID_KEYSTORE_PASSWORD"
            echo "keystorePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/minute-of-silence-release.keystore"
          } > keystore.properties

      - name: Build APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.TAURI_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TAURI_ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --ci --split-per-abi --apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minute-of-silence-android-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: Run Android unit tests
        run: ./gradlew :app:testUniversalDebugUnitTest
        working-directory: src-tauri/gen/android
