[package]
name = "khvylyna-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Serhii Cherneha"]
license-file = "../../LICENSE"
description = "Shared core types, contracts, and schema definitions for Minute of Silence"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc", "preserve_order"], optional = true }
ts-rs = { version = "12.0", optional = true, features = ["chrono-impl"] }

[features]
default = ["std"]
std = [
    "serde/std",
    "chrono/std",
    "dep:serde_json",
    "serde_json/std",
]
alloc = [
    "serde/alloc",
    "chrono/alloc",
]
ts = [
    "dep:ts-rs",
    "std",
]
