[package]
name = "khvylyna-pairing"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license-file = "../../LICENSE"

[features]
default = ["std"]
std = ["dep:rand", "dep:tokio"]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
hkdf = { version = "0.13", default-features = false }
pake-cpace-embedded = "0.2.2"
rand = { version = "0.8", default-features = false, features = ["getrandom"], optional = true }
rand_core = { version = "0.6.4", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "1.52", default-features = false, features = ["io-util", "net"], optional = true }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "time"] }
